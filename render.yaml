services:
  - type: web
    runtime: static
    name: bintrack-web
    branch: main
    buildCommand: bash scripts/render_build_web.sh
    staticPublishPath: build/web
    envVars:
      - key: API_HOST
        value: https://bintrack-backend.onrender.com
      - key: SKIP_INSTALL_DEPS
        value: "true"
